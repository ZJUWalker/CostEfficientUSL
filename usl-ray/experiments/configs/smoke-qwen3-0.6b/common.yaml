base: ../defaults.yaml
run: {name: smoke-qwen3-0.6b}
model:
  path: experiments/configs/smoke-qwen3-0.6b/model
  init: random
  architecture: qwen3
  num_hidden_layers: 28
  hidden_size: 1024
  vocab_size: 151936
  dtype: bfloat16
split: {split_point: 4}
batch: {batch_size: 8, micro_batch_size: 1, max_seq_len: 4096}
train: {steps: 10}
profile: {warmup_steps: 4}
