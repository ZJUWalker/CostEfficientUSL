[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "usl-ray"
version = "0.1.0"
description = "Ray-based U-shaped split learning for causal language models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate==1.14.0",
    "datasets==4.0.0",
    "huggingface-hub==1.3.7",
    "matplotlib==3.10.8",
    "numpy==2.3.5",
    "packaging==24.2",
    "pandas==2.3.3",
    "peft==0.20.0",
    "psutil==6.0.0",
    "protobuf==3.20.3",
    "pyarrow==17.0.0",
    "PyYAML==6.0.3",
    "ray==2.58.0",
    "safetensors==0.8.0",
    "tokenizers==0.22.2",
    "torch==2.9.1",
    "transformers==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[project.scripts]
usl-ray = "usl_ray.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires CUDA GPUs",
    "integration: requires a local Ray cluster",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP035"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"usl" = { msg = "usl-ray must not import the legacy usl package" }
